[binaries]
c = 'clang'
cpp = 'clang++'
objc = 'clang'
ar = 'ar'
strip = 'strip'
pkg-config = 'false'

[host_machine]
system = 'darwin'
cpu_family = 'aarch64'
cpu = 'arm64'
endian = 'little'

[built-in options]
c_args = ['-arch', 'arm64', '-isysroot', '__SDK__', '-miphoneos-version-min=13.0']
cpp_args = ['-arch', 'arm64', '-isysroot', '__SDK__', '-miphoneos-version-min=13.0']
objc_args = ['-arch', 'arm64', '-isysroot', '__SDK__', '-miphoneos-version-min=13.0']
c_link_args = ['-arch', 'arm64', '-isysroot', '__SDK__', '-miphoneos-version-min=13.0']
cpp_link_args = ['-arch', 'arm64', '-isysroot', '__SDK__', '-miphoneos-version-min=13.0']
default_library = 'static'
